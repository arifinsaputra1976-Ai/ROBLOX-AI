<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox AI Script - Memory System</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #ff6b35;
            --secondary: #004e89;
            --accent: #1dd1a1;
            --dark: #0a0e27;
            --darker: #050810;
            --light: #f0f3ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: #e2e8f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.9), rgba(5, 8, 16, 0.8));
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
            padding: 15px 20px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.5em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .memory-badge {
            display: inline-block;
            background: rgba(29, 209, 161, 0.2);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            color: var(--accent);
        }

        /* PLATFORM SELECTOR */
        .platform-selector {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .platform-btn {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9em;
        }

        .platform-btn.active {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary);
        }

        /* MAIN CONTENT */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            flex: 1;
            overflow: hidden;
            gap: 10px;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .code-panel {
                display: none !important;
            }

            .code-panel.show {
                display: flex !important;
                grid-column: 1 / -1;
            }
        }

        /* CHAT PANEL */
        .chat-panel {
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .message {
            display: flex;
            animation: slideUp 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 0.9em;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary), #ff8c42);
            color: white;
            border-bottom-right-radius: 3px;
        }

        .message.ai .bubble {
            background: rgba(0, 78, 137, 0.3);
            color: #cbd5e1;
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
            gap: 10px;
        }

        /* INPUT AREA */
        .input-area {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9em;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85em;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--primary), #ff8c42);
            color: white;
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-toggle-code {
            background: rgba(29, 209, 161, 0.2);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        /* CODE PANEL */
        .code-panel {
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .code-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9em;
        }

        .code-display {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .code-display code {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 0.75em;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .code-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        .code-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
        }

        .code-btn:active {
            background: rgba(255, 107, 53, 0.3);
        }

        .code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* LOADING */
        .loading {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--accent), #00d4aa);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            animation: slideUp 0.3s ease-out;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        .notification.show {
            display: block;
        }

        .notification.error {
            background: linear-gradient(135deg, var(--primary), #ff8c42);
        }

        /* ANIMATIONS */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(1); }
            40% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">⚡ ROBLOX AI</div>
            <div class="memory-badge">
                🧠 Memory Active | 💬 <span id="messageCount">0</span> | 💾 <span id="scriptCount">0</span>
            </div>
        </div>

        <!-- PLATFORM SELECTOR -->
        <div class="platform-selector">
            <button class="platform-btn active" onclick="switchPlatform('mobile')" id="mobilePlatform">
                📱 Mobile
            </button>
            <button class="platform-btn" onclick="switchPlatform('web')" id="webPlatform">
                🌐 Web
            </button>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">
            <!-- CHAT PANEL -->
            <div class="chat-panel">
                <div class="messages" id="messages">
                    <div class="empty-state">
                        <div>💬 Halo! Saya AI Roblox Script Generator</div>
                        <div style="font-size: 0.8em; color: #64748b;">
                            Ceritakan script apa yang Anda butuhkan
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <input 
                        type="text" 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Deskripsikan script..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="btn btn-send" onclick="sendMessage()" id="sendBtn">Kirim</button>
                    <button class="btn btn-toggle-code" onclick="toggleCodePanel()">📋</button>
                    <button class="btn btn-clear" onclick="clearChat()">🗑️</button>
                </div>
            </div>

            <!-- CODE PANEL -->
            <div class="code-panel" id="codePanel">
                <div class="code-header">✨ Generated Code</div>
                <div class="code-display" id="codeDisplay">
                    <code>Code akan tampil di sini...</code>
                </div>
                <div class="code-buttons">
                    <button class="code-btn" onclick="copyCode()" id="copyBtn" disabled>
                        📋 Copy
                    </button>
                    <button class="code-btn" onclick="downloadCode()" id="downloadBtn" disabled>
                        ⬇️ Download
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notification" id="notification"></div>

    <script>
        // ===================================
        // CONFIGURATION
        // ===================================
        
        const API_URL = 'https://api.anthropic.com/v1/messages';
        const STORAGE_KEY = 'roblox_ai_conversations';
        
        let currentPlatform = 'mobile';
        let currentCode = '';
        let conversations = [];

        // ===================================
        // MEMORY MANAGEMENT
        // ===================================
        
        function loadConversations() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function saveConversations() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
                updateStats();
                return true;
            } catch {
                return false;
            }
        }

        function addMessage(role, content) {
            conversations.push({
                role: role,
                content: content,
                timestamp: new Date().toISOString(),
                platform: currentPlatform
            });
            saveConversations();
        }

        function updateStats() {
            document.getElementById('messageCount').textContent = conversations.length;
        }

        // ===================================
        // UI FUNCTIONS
        // ===================================
        
        function switchPlatform(platform) {
            currentPlatform = platform;
            document.getElementById('mobilePlatform').classList.toggle('active', platform === 'mobile');
            document.getElementById('webPlatform').classList.toggle('active', platform === 'web');
        }

        function toggleCodePanel() {
            const codePanel = document.getElementById('codePanel');
            codePanel.classList.toggle('show');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addMessageToUI(content, role) {
            const messagesDiv = document.getElementById('messages');
            
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.toggle('error', isError);
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // ===================================
        // MAIN CHAT FUNCTION
        // ===================================
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            addMessageToUI(message, 'user');
            addMessage('user', message);
            
            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            try {
                // Show loading
                const messagesDiv = document.getElementById('messages');
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message ai';
                loadingDiv.innerHTML = '<div class="bubble"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
                messagesDiv.appendChild(loadingDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // Get API key from user
                const apiKey = prompt('Masukan Claude API Key (sk-ant-...):');
                if (!apiKey) {
                    loadingDiv.remove();
                    showNotification('API Key diperlukan', true);
                    document.getElementById('sendBtn').disabled = false;
                    return;
                }

                // Build system prompt dengan conversation history
                const recentChats = conversations.slice(-6)
                    .map(msg => `${msg.role === 'user' ? 'User' : 'AI'}: ${msg.content.substring(0, 100)}`)
                    .join('\n');

                const systemPrompt = `Anda adalah Roblox Lua Script Expert dengan PERMANENT MEMORY.

PLATFORM: ${currentPlatform === 'mobile' ? 'Mobile (Touch, UserInputService)' : 'Web (DataStore, HTTP)'}

RECENT CONTEXT:
${recentChats || 'Ini percakapan pertama'}

TUGAS:
1. Generate Lua script ERROR-FREE
2. INGAT semua percakapan sebelumnya
3. Understand context & preferensi user
4. Include error handling lengkap
5. Add comments untuk clarity

FORMAT:
PENJELASAN:
[Brief explanation]

\`\`\`lua
-- Complete working script
-- With error handling
\`\`\`

TIPS:
[3-4 implementation tips]`;

                // Call Claude API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 2000,
                        system: systemPrompt,
                        messages: conversations.map(msg => ({
                            role: msg.role,
                            content: msg.content
                        }))
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const data = await response.json();
                const aiResponse = data.content[0].text;

                loadingDiv.remove();
                addMessageToUI(aiResponse, 'ai');
                addMessage('assistant', aiResponse);

                // Extract code
                const codeMatch = aiResponse.match(/```lua([\s\S]*?)```/);
                if (codeMatch) {
                    currentCode = codeMatch[1].trim();
                    document.getElementById('codeDisplay').innerHTML = 
                        `<code>${escapeHtml(currentCode)}</code>`;
                    
                    document.getElementById('copyBtn').disabled = false;
                    document.getElementById('downloadBtn').disabled = false;
                }

            } catch (error) {
                addMessageToUI('❌ Error: ' + error.message, 'ai');
                showNotification('Error: ' + error.message, true);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        function copyCode() {
            if (!currentCode) return;
            
            navigator.clipboard.writeText(currentCode).then(() => {
                showNotification('✅ Code copied!');
            }).catch(() => {
                showNotification('❌ Copy failed', true);
            });
        }

        function downloadCode() {
            if (!currentCode) return;
            
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(currentCode));
            element.setAttribute('download', `roblox_${currentPlatform}_${Date.now()}.lua`);
            element.click();
            
            showNotification('✅ Downloaded!');
        }

        function clearChat() {
            if (confirm('Hapus semua chat?')) {
                conversations = [];
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('messages').innerHTML = `
                    <div class="empty-state">
                        <div>💬 Chat cleared</div>
                        <div style="font-size: 0.8em; color: #64748b;">Memory reset</div>
                    </div>
                `;
                updateStats();
            }
        }

        // ===================================
        // INITIALIZE
        // ===================================
        
        window.addEventListener('load', () => {
            conversations = loadConversations();
            updateStats();
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
  </html>
